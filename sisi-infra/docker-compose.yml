services:
  sisi-infra:
    build:
      context: ..
      dockerfile: sisi-infra/Dockerfile
    container_name: sisi-infra
    restart: unless-stopped
    ports:
      - "6640:6640"
    environment:
      - RUST_LOG=info

  sisi-relay:
    image: ghcr.io/n0-computer/iroh-relay:latest
    container_name: sisi-relay
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "3478:3478/udp"
    volumes:
      - ./relay.toml:/config/relay.toml:ro
      - relay-certs:/certs
    environment:
      - RELAY_HOSTNAME=${RELAY_HOSTNAME}
      - ACME_CONTACT=${ACME_CONTACT}
      - RUST_LOG=iroh_relay=info
    command: --config /config/relay.toml

  sisi-dns:
    image: ghcr.io/n0-computer/iroh-dns-server:latest
    container_name: sisi-dns
    restart: unless-stopped
    ports:
      - "5353:5353/udp"
      - "8080:8080"
    volumes:
      - ./dns.toml:/config/dns.toml:ro
      - dns-data:/data
    environment:
      - DNS_ORIGIN=${DNS_ORIGIN}
      - RUST_LOG=info
    command: --config /config/dns.toml

volumes:
  relay-certs:
  dns-data:

