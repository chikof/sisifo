services:
  sisi-infra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sisi-infra
    restart: unless-stopped
    ports:
      - "6640:6640"
    environment:
      - RUST_LOG=info
    networks:
      - sisi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6640/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sisi-relay:
    image: ghcr.io/n0-computer/iroh-relay:latest
    container_name: sisi-relay
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RELAY_HOSTNAME=${RELAY_HOSTNAME}
      - ACME_CONTACT=${ACME_CONTACT}
      - RUST_LOG=info
    volumes:
      - ./relay.toml:/config/relay.toml:ro
      - relay-certs:/certs
    command: --config /config/relay.toml
    networks:
      - sisi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health", "-k"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  sisi-dns:
    image: ghcr.io/n0-computer/iroh-dns-server:latest
    container_name: sisi-dns
    restart: unless-stopped
    ports:
      - "5353:5353/udp"
      - "8080:8080"
    environment:
      - DNS_ORIGIN=${DNS_ORIGIN}
      - RUST_LOG=info
    volumes:
      - ./dns.toml:/config/dns.toml:ro
      - dns-data:/data
    command: --config /config/dns.toml
    networks:
      - sisi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  relay-certs:
  dns-data:

networks:
  sisi-net:
    driver: bridge
