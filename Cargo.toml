[workspace]
resolver = "2"
members = [
  "crates/node",
  "crates/gateway",
  "crates/publisher",
  "crates/resolver",
  "crates/manifest",
  "crates/types",
  # "src-tauri",
]

[workspace.dependencies]
iroh = "0.97.0"
iroh-blobs = "0.99.0"
axum = { version = "0.8.8", features = ["tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
bytes = "1.11.1"
