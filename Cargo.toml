[workspace]
resolver = "2"
members = [
  "crates/node",
  "crates/gateway",
  "crates/publisher",
  "crates/resolver",
  "crates/manifest",
  "crates/types",
  "crates/sisi-daemon",
  "src-tauri",
  "sisi-infra",
  "crates/gossip",
  "crates/index",
  "crates/pointer",
  "crates/names",
]

[workspace.dependencies]
iroh = { version = "0.98.0", features = ["address-lookup-pkarr-dht"] }
iroh-blobs = "0.99.0"
axum = { version = "0.8.8", features = ["tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
ed25519-dalek = { version = "2.2.0", features = ["serde", "rand_core"] }
bytes = "1.11.1"
tree_magic_mini = "3.2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.4.2"
hex = "0.4.3"
dirs = "6.0.0"
iroh-gossip = "0.97.0"
ulid = "1.2.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio-stream = "0.1.18"
sha2 = "0.10.9"
reqwest = { version = "0.13.2", features = [
  "json",
  "rustls",
], default-features = false }
